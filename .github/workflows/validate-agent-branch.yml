name: Validate agent branch

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "hotfix/**"

env:
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  DATABASE_URL: "postgresql://user:password@localhost:5432/synergi_ci"
  SYNERGI_ADMIN_USERNAME: "ci-admin"
  SYNERGI_ADMIN_PASSWORD: "ci-password-placeholder"
  SYNERGI_ADMIN_SESSION_SECRET: "ci-session-secret-placeholder"
  NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
  RECAPTCHA_SECRET_KEY: "6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe"
  RECAPTCHA_VERIFY_URL: "https://www.google.com/recaptcha/api/siteverify"

jobs:
  validate:
    name: Validate agent branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Success
        if: success()
        run: echo "✓ Agent branch validated successfully"
